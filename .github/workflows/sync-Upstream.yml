name: Sync Upstream

# Triggers: daily schedule + manual dispatch
on:
  # schedule:
  #   - cron: '0 0 * * *'  # Runs daily at 00:00 UTC (08:00 Beijing time)
  workflow_dispatch:     # Supports manual run from the Actions page

permissions:
  contents: write
  pull-requests: write

jobs:
  sync_and_diff:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: main
      SYNC_BRANCH: sync/upstream-main
      SYNC_AUTH_TOKEN: ${{ secrets.SYNC_PR_PAT }}
    # Prevent duplicate workflow runs on the same ref
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout full repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full git history to ensure merge/diff works correctly
          ref: main  # Ensure the workflow runs on the main branch; adjust if your default branch is different
          token: ${{ env.SYNC_AUTH_TOKEN != '' && env.SYNC_AUTH_TOKEN || github.token }}

      - name: Set environment & timestamp
        id: env_info
        run: |
          # Generate a timestamp for report filenames to avoid overwrite
          TS=$(date +%Y%m%d_%H%M%S)
          echo "TIMESTAMP=$TS" >> $GITHUB_OUTPUT
          echo "REPORT_DIR=diff_reports" >> $GITHUB_OUTPUT
          mkdir -p diff_reports

      - name: Configure Git & Add Upstream Remote
        run: |
          git config --global user.name "GitHub Actions Sync Bot"
          git config --global user.email "sync-bot@github.com"
          # Safely remove existing upstream remote to avoid errors
          git remote remove upstream || true
          # ==================== Update this upstream repository URL if needed ====================
          git remote add upstream https://github.com/PSAppDeployToolkit/PSAppDeployToolkit.git
          git fetch upstream

      - name: Check if there are upstream updates
        id: check_updates
        run: |
          # Count commits that exist in upstream but not in local HEAD
          COUNT=$(git rev-list --count HEAD..upstream/$TARGET_BRANCH)
          echo "commit_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Found $COUNT new commits from upstream"

      # Only generate diff reports when updates are detected
      - name: Generate Text Diff Report
        if: ${{ fromJSON(steps.check_updates.outputs.commit_count) > 0 }}
        run: |
          git diff HEAD upstream/$TARGET_BRANCH > ${{ steps.env_info.outputs.REPORT_DIR }}/diff_${{ steps.env_info.outputs.TIMESTAMP }}.txt || true

      - name: Install AHA for HTML report generation
        if: ${{ fromJSON(steps.check_updates.outputs.commit_count) > 0 }}
        run: |
          sudo apt-get update
          sudo apt-get install -y aha

      - name: Generate HTML Diff Report
        if: ${{ fromJSON(steps.check_updates.outputs.commit_count) > 0 }}
        run: |
          git diff --color=never HEAD upstream/$TARGET_BRANCH | aha > ${{ steps.env_info.outputs.REPORT_DIR }}/diff_${{ steps.env_info.outputs.TIMESTAMP }}.html || true

      # Merge upstream changes; fail workflow on conflicts
      - name: Merge upstream code
        if: ${{ fromJSON(steps.check_updates.outputs.commit_count) > 0 }}
        run: |
          git merge upstream/$TARGET_BRANCH --no-edit
        continue-on-error: false

      # Push synced code to a dedicated branch (avoids protected-branch direct push)
      - name: Push synced code to sync branch
        if: ${{ fromJSON(steps.check_updates.outputs.commit_count) > 0 }}
        run: |
          git switch -C "$SYNC_BRANCH"
          git push --force-with-lease origin "$SYNC_BRANCH"

      # Open PR (or reuse existing open PR) from sync branch to target branch
      - name: Create or reuse pull request
        id: pr_step
        if: ${{ fromJSON(steps.check_updates.outputs.commit_count) > 0 }}
        uses: actions/github-script@v7
        env:
          BASE_BRANCH: ${{ env.TARGET_BRANCH }}
          SYNC_BRANCH: ${{ env.SYNC_BRANCH }}
        with:
          github-token: ${{ env.SYNC_AUTH_TOKEN != '' && env.SYNC_AUTH_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = process.env.BASE_BRANCH;
            const syncBranch = process.env.SYNC_BRANCH;
            const head = `${owner}:${syncBranch}`;
            const compareUrl = `${context.serverUrl}/${owner}/${repo}/compare/${base}...${syncBranch}?expand=1`;

            core.setOutput('pr_creation_blocked', 'false');
            core.setOutput('manual_pr_url', compareUrl);

            try {
              const existing = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                base,
                head
              });

              if (existing.data.length > 0) {
                core.info(`PR already exists: ${existing.data[0].html_url}`);
                core.setOutput('pr_url', existing.data[0].html_url);
                return;
              }

              const created = await github.rest.pulls.create({
                owner,
                repo,
                title: `chore: sync upstream ${base}`,
                head: syncBranch,
                base,
                body: [
                  'Automated upstream sync created by workflow.',
                  '',
                  `- Source: upstream/${base}`,
                  `- Target: ${base}`,
                  `- Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
                ].join('\n')
              });

              core.info(`Created PR: ${created.data.html_url}`);
              core.setOutput('pr_url', created.data.html_url);
            } catch (error) {
              if (error.status === 403 && String(error.message).includes('not permitted to create or approve pull requests')) {
                core.warning('Repository settings or token permissions block automated PR creation.');
                core.warning(`Create PR manually: ${compareUrl}`);
                core.setOutput('pr_creation_blocked', 'true');
                return;
              }

              throw error;
            }

      - name: Add manual PR link to workflow summary
        if: ${{ fromJSON(steps.check_updates.outputs.commit_count) > 0 && steps.pr_step.outputs.pr_creation_blocked == 'true' }}
        run: |
          echo "### Upstream Sync: Manual PR required" >> "$GITHUB_STEP_SUMMARY"
          echo "Automated PR creation is blocked by repository settings or token permissions." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open this link to create the PR:" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.pr_step.outputs.manual_pr_url }}" >> "$GITHUB_STEP_SUMMARY"

      # Upload diff reports as artifacts with configured retention period
      - name: Upload Diff Reports Artifact
        if: ${{ fromJSON(steps.check_updates.outputs.commit_count) > 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-diff-reports_${{ steps.env_info.outputs.TIMESTAMP }}
          path: ${{ steps.env_info.outputs.REPORT_DIR }}/
          # Public repos: up to 90 days | Private repos: up to 400 days
          retention-days: 90
          # retention-days: 400

      # Clean up temporary files (optional, keeps workspace tidy)
      - name: Clean temporary files
        if: always()
        run: |
          rm -rf ${{ steps.env_info.outputs.REPORT_DIR }}
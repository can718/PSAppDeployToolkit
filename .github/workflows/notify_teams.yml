name: Notify Teams of Job Status
on:
  workflow_call:
    inputs:
      job_status:
        required: true
        type: string
      steps_json:
        description: 'JSON object mapping step name to outcome, e.g. {"Build":"success","Test":"failure"}'
        required: false
        type: string
        default: '{}'
      pester_total:
        required: false
        type: number
        default: 0
      pester_passed:
        required: false
        type: number
        default: 0
      pester_failed:
        required: false
        type: number
        default: 0
      pester_skipped:
        required: false
        type: number
        default: 0
jobs:
  send:
    runs-on: windows-latest
    steps:
      - name: send msg
        shell: pwsh
        env:
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
          STATUS: ${{ inputs.job_status }}
          STEPS_JSON: ${{ inputs.steps_json }}
          PESTER_TOTAL: ${{ inputs.pester_total }}
          PESTER_PASSED: ${{ inputs.pester_passed }}
          PESTER_FAILED: ${{ inputs.pester_failed }}
          PESTER_SKIPPED: ${{ inputs.pester_skipped }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $statusMap = @{
            success   = @{ Color = '00CC44'; Icon = '✅' }
            failure   = @{ Color = 'FF0000'; Icon = '❌' }
            cancelled = @{ Color = '808080'; Icon = '🚫' }
          }

          $statusMeta = if ($statusMap.ContainsKey($env:STATUS)) {
            $statusMap[$env:STATUS]
          }
          else {
            @{ Color = 'FFA500'; Icon = '⏭️' }
          }

          $stepsJsonRaw = if ([string]::IsNullOrWhiteSpace($env:STEPS_JSON)) {
            '{}'
          }
          else {
            $env:STEPS_JSON.Replace("`r", '')
          }

          try {
            $stepsObject = $stepsJsonRaw | ConvertFrom-Json -AsHashtable -ErrorAction Stop
            if ($stepsObject -isnot [hashtable]) {
              $stepsObject = @{}
            }
          }
          catch {
            $stepsObject = @{}
          }

          $outcomeMap = @{
            success   = '✅ success'
            failure   = '❌ failure'
            skipped   = '⏭️ skipped'
            cancelled = '🚫 cancelled'
          }

          $stepFacts = @()
          foreach ($stepName in $stepsObject.Keys) {
            $rawValue = [string]$stepsObject[$stepName]
            $displayValue = if ($outcomeMap.ContainsKey($rawValue)) {
              $outcomeMap[$rawValue]
            }
            else {
              $rawValue
            }

            $stepFacts += @{
              name  = $stepName
              value = $displayValue
            }
          }

          $shortSha = if ($env:COMMIT_SHA -and $env:COMMIT_SHA.Length -ge 7) {
            $env:COMMIT_SHA.Substring(0, 7)
          }
          else {
            [string]$env:COMMIT_SHA
          }

          $commitMessage = [string]$env:COMMIT_MSG
          $commitTitle = ($commitMessage -split "`r?`n")[0]

          $sections = @(
            @{
              activityTitle = 'Stage: Pipeline Steps'
              facts         = $stepFacts
            },
            @{
              activityTitle = 'CI Info'
              facts         = @(
                @{ name = 'Workflow'; value = $env:WORKFLOW },
                @{ name = 'Branch'; value = $env:BRANCH },
                @{ name = 'Commit'; value = $shortSha },
                @{ name = 'Message'; value = $commitTitle },
                @{ name = 'Triggered by'; value = $env:ACTOR }
              )
            }
          )

          $pesterTotal = 0
          [void][int]::TryParse([string]$env:PESTER_TOTAL, [ref]$pesterTotal)
          if ($pesterTotal -gt 0) {
            $sections += @{
              activityTitle = 'Pester Test Results'
              facts         = @(
                @{ name = 'Total'; value = [string]$env:PESTER_TOTAL },
                @{ name = '✅ Passed'; value = [string]$env:PESTER_PASSED },
                @{ name = '❌ Failed'; value = [string]$env:PESTER_FAILED },
                @{ name = '⏭️ Skipped'; value = [string]$env:PESTER_SKIPPED }
              )
            }
          }

          $actions = @(
            @{
              '@type'  = 'OpenUri'
              name     = '🔗 View Workflow Run'
              targets  = @(
                @{ os = 'default'; uri = $env:RUN_URL }
              )
            }
          )

          $payload = @{
            '@type'           = 'MessageCard'
            '@context'        = 'http://schema.org/extensions'
            themeColor        = $statusMeta.Color
            title             = "🚀 Pipeline: $($env:WORKFLOW)"
            text              = "Pipeline Status: **$($statusMeta.Icon) $($env:STATUS)**`n`nBranch: ``$($env:BRANCH)`` · Commit: ``$shortSha`` `n`nMessage: $commitTitle`n`nTriggered by: $($env:ACTOR)"
            sections          = $sections
            potentialAction   = $actions
          }

          $payloadJson = $payload | ConvertTo-Json -Depth 10 -Compress
          Invoke-RestMethod -Method Post -Uri $env:WEBHOOK -ContentType 'application/json' -Body $payloadJson | Out-Null

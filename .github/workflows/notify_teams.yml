name: Notify Teams of Job Status
on:
  workflow_call:
    inputs:
      job_status:
        required: true
        type: string
      steps_json:
        description: 'JSON object mapping step name to outcome, e.g. {"Build":"success","Test":"failure"}'
        required: false
        type: string
        default: '{}'
      pester_discovered:
        required: false
        type: string
        default: '0'
      pester_total:
        required: false
        type: string
        default: '0'
      pester_passed:
        required: false
        type: string
        default: '0'
      pester_failed:
        required: false
        type: string
        default: '0'
      pester_skipped:
        required: false
        type: string
        default: '0'
      pester_notrun:
        required: false
        type: string
        default: '0'
jobs:
  send:
    name: Send Notification
    runs-on: windows-latest
    steps:
      - name: send msg
        shell: pwsh
        env:
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
          STATUS: ${{ inputs.job_status }}
          STEPS_JSON: ${{ inputs.steps_json }}
          PESTER_DISCOVERED: ${{ inputs.pester_discovered }}
          PESTER_TOTAL: ${{ inputs.pester_total }}
          PESTER_PASSED: ${{ inputs.pester_passed }}
          PESTER_FAILED: ${{ inputs.pester_failed }}
          PESTER_SKIPPED: ${{ inputs.pester_skipped }}
          PESTER_NOTRUN: ${{ inputs.pester_notrun }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $diagnostics = New-Object System.Collections.Generic.List[string]

          $webhook = [string]$env:WEBHOOK
          if ([string]::IsNullOrWhiteSpace($webhook)) {
            Write-Error 'Teams webhook is missing. Cannot send notification.'
            exit 1
          }

          if (-not [System.Uri]::IsWellFormedUriString($webhook, [System.UriKind]::Absolute)) {
            Write-Error 'Teams webhook is not a valid absolute URL. Cannot send notification.'
            exit 1
          }

          $statusKey = ([string]$env:STATUS).Trim().ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($statusKey)) {
            $statusKey = 'unknown'
            [void]$diagnostics.Add('job_status is empty; using unknown.')
          }

          $statusMap = @{
            success   = @{ Color = '00CC44'; Icon = '✅' }
            failure   = @{ Color = 'FF0000'; Icon = '❌' }
            cancelled = @{ Color = '808080'; Icon = '🚫' }
            skipped   = @{ Color = 'FFA500'; Icon = '⏭️' }
            unknown   = @{ Color = 'FFA500'; Icon = '⚠️' }
          }

          $statusMeta = if ($statusMap.ContainsKey($statusKey)) {
            $statusMap[$statusKey]
          }
          else {
            @{ Color = 'FFA500'; Icon = '⚠️' }
          }

          $statusLabelMap = @{
            success   = 'success'
            failure   = 'failure'
            cancelled = 'cancelled'
            skipped   = 'skipped'
            unknown   = 'unknown'
          }
          $statusLabel = if ($statusLabelMap.ContainsKey($statusKey)) { $statusLabelMap[$statusKey] } else { $statusKey }

          $stepsJsonRaw = if ([string]::IsNullOrWhiteSpace($env:STEPS_JSON)) {
            [void]$diagnostics.Add('steps_json is empty; using {}.')
            '{}'
          }
          else {
            $env:STEPS_JSON.Replace("`r", '')
          }

          try {
            $stepsObject = $stepsJsonRaw | ConvertFrom-Json -AsHashtable -ErrorAction Stop
            if ($stepsObject -isnot [hashtable]) {
              $stepsObject = @{}
              [void]$diagnostics.Add('steps_json is not a JSON object; using {}.')
            }
          }
          catch {
            $stepsObject = @{}
            [void]$diagnostics.Add("steps_json parse failed: $($_.Exception.Message)")
          }

          $outcomeMap = @{
            success   = '✅ success'
            failure   = '❌ failure'
            skipped   = '⏭️ skipped'
            cancelled = '🚫 cancelled'
            unknown   = '⚠️ unknown'
          }

          function New-MarkdownTable {
            param(
              [Parameter(Mandatory = $true)]
              [string[]]$Headers,
              [Parameter(Mandatory = $true)]
              [object[]]$Rows,
              [int[]]$ColumnWidths
            )

            function Get-CellLength {
              param(
                [string]$Value
              )

              if ($null -eq $Value) {
                return 0
              }

              return $Value.Replace("`r", '').Replace("`n", ' ').Length
            }

            function Pad-Cell {
              param(
                [string]$Value,
                [int]$TargetLength
              )

              if ($null -eq $Value) {
                $Value = ''
              }

              $currentLength = Get-CellLength -Value $Value
              $padding = [math]::Max($TargetLength - $currentLength, 0)
              if ($padding -le 0) {
                return $Value
              }

              return ($Value + (' ' * $padding))
            }

            function Escape-CellText {
              param(
                [string]$Value
              )

              if ($null -eq $Value) {
                return ''
              }

              return $Value.Replace('&', '&amp;').Replace('<', '&lt;').Replace('>', '&gt;')
            }

            $effectiveColumnWidths = @()
            for ($i = 0; $i -lt $Headers.Count; $i++) {
              if ($ColumnWidths -and $ColumnWidths.Count -gt $i -and $ColumnWidths[$i] -gt 0) {
                $effectiveColumnWidths += $ColumnWidths[$i]
              }
              else {
                $effectiveColumnWidths += (Get-CellLength -Value $Headers[$i])
              }
            }

            $w1 = [math]::Max($effectiveColumnWidths[0], 3)
            $w2 = [math]::Max($effectiveColumnWidths[1], 3)
            $border = '+' + ('-' * ($w1 + 2)) + '+' + ('-' * ($w2 + 2)) + '+'

            $headerLeft = Pad-Cell -Value (Escape-CellText -Value $Headers[0]) -TargetLength $w1
            $headerRight = Pad-Cell -Value (Escape-CellText -Value $Headers[1]) -TargetLength $w2

            $lines = @()
            $lines += $border
            $lines += '| ' + $headerLeft + ' | ' + $headerRight + ' |'
            $lines += $border
            foreach ($row in $Rows) {
              $leftValue = [string]$row[$Headers[0]]
              $rightValue = [string]$row[$Headers[1]]

              if ($null -eq $leftValue) {
                $leftValue = ''
              }

              if ($null -eq $rightValue) {
                $rightValue = ''
              }

              $leftValue = Escape-CellText -Value $leftValue.Replace("`r", ' ').Replace("`n", ' ')
              $rightValue = Escape-CellText -Value $rightValue.Replace("`r", ' ').Replace("`n", ' ')

              $leftPadded = Pad-Cell -Value $leftValue -TargetLength $w1
              $rightPadded = Pad-Cell -Value $rightValue -TargetLength $w2
              $lines += '| ' + $leftPadded + ' | ' + $rightPadded + ' |'
            }
            $lines += $border

            '<pre>' + ($lines -join "`n") + '</pre>'
          }

          $stepRows = @()
          foreach ($stepName in $stepsObject.Keys) {
            $normalizedStepName = ([string]$stepName).Trim()
            if ([string]::IsNullOrWhiteSpace($normalizedStepName)) {
              $normalizedStepName = '(unnamed step)'
            }

            $rawValue = [string]$stepsObject[$stepName]
            $normalizedOutcome = $rawValue.Trim().ToLowerInvariant()
            if ([string]::IsNullOrWhiteSpace($normalizedOutcome)) {
              $normalizedOutcome = 'unknown'
            }

            $displayValue = if ($outcomeMap.ContainsKey($normalizedOutcome)) {
              $outcomeMap[$normalizedOutcome]
            }
            else {
              "⚠️ $normalizedOutcome"
            }

            $stepRows += @{
              Step   = $normalizedStepName
              Result = $displayValue
            }
          }

          $jobResultDisplay = if ($outcomeMap.ContainsKey($statusKey)) {
            $outcomeMap[$statusKey]
          }
          else {
            "⚠️ $statusKey"
          }

          if ($stepRows.Count -eq 0) {
            $stepRows += @{
              Step   = 'Pipeline Job Result'
              Result = $jobResultDisplay
            }
            $stepRows += @{
              Step   = 'Details'
              Result = 'No step outcomes were provided.'
            }
          }

          $stepRows = $stepRows | Sort-Object -Property Step

          $workflowName = ([string]$env:WORKFLOW).Trim()
          if ([string]::IsNullOrWhiteSpace($workflowName)) {
            $workflowName = '(unknown workflow)'
          }

          $branchName = ([string]$env:BRANCH).Trim()
          if ([string]::IsNullOrWhiteSpace($branchName)) {
            $branchName = '(unknown branch)'
          }

          $actorName = ([string]$env:ACTOR).Trim()
          if ([string]::IsNullOrWhiteSpace($actorName)) {
            $actorName = '(unknown actor)'
          }

          $shortSha = if ($env:COMMIT_SHA -and $env:COMMIT_SHA.Length -ge 7) {
            $env:COMMIT_SHA.Substring(0, 7)
          }
          else {
            [string]$env:COMMIT_SHA
          }

          if ([string]::IsNullOrWhiteSpace($shortSha)) {
            $shortSha = '(none)'
          }

          $commitMessage = [string]$env:COMMIT_MSG
          $commitTitle = (($commitMessage -split "`r?`n")[0]).Trim()
          if ([string]::IsNullOrWhiteSpace($commitTitle)) {
            $commitTitle = '(no commit message)'
          }

          $runUrl = ([string]$env:RUN_URL).Trim()
          if (-not [System.Uri]::IsWellFormedUriString($runUrl, [System.UriKind]::Absolute)) {
            $runUrl = $null
            [void]$diagnostics.Add('run_url is invalid; action button omitted.')
          }

          $ciInfoRows = @(
            @{ Item = 'Workflow'; Value = $workflowName },
            @{ Item = 'Branch'; Value = $branchName },
            @{ Item = 'Commit'; Value = $shortSha },
            @{ Item = 'Message'; Value = $commitTitle },
            @{ Item = 'Triggered by'; Value = $actorName }
          )

          $pesterTotal = 0
          $pesterDiscovered = 0
          $pesterPassed = 0
          $pesterFailed = 0
          $pesterSkipped = 0
          $pesterNotRunInput = 0
          $hasDiscoveredInput = [int]::TryParse([string]$env:PESTER_DISCOVERED, [ref]$pesterDiscovered)
          [void][int]::TryParse([string]$env:PESTER_TOTAL, [ref]$pesterTotal)
          [void][int]::TryParse([string]$env:PESTER_PASSED, [ref]$pesterPassed)
          [void][int]::TryParse([string]$env:PESTER_FAILED, [ref]$pesterFailed)
          [void][int]::TryParse([string]$env:PESTER_SKIPPED, [ref]$pesterSkipped)
          $hasNotRunInput = [int]::TryParse([string]$env:PESTER_NOTRUN, [ref]$pesterNotRunInput)
          $pesterExecuted = [math]::Max($pesterPassed + $pesterFailed + $pesterSkipped, 0)
          if ($hasDiscoveredInput -and $pesterDiscovered -gt 0) {
            $pesterTotal = $pesterDiscovered
          }
          $pesterNotRun = if ($hasNotRunInput -and $pesterNotRunInput -ge 0) {
            $pesterNotRunInput
          }
          else {
            [math]::Max($pesterTotal - $pesterExecuted, 0)
          }

          if ($pesterTotal -gt 0 -or $pesterExecuted -gt 0) {
            $pesterRows = @(
              @{ Metric = 'Total'; Value = [string]$pesterTotal },
              @{ Metric = 'Executed'; Value = [string]$pesterExecuted },
              @{ Metric = 'Passed'; Value = "✅ $pesterPassed" },
              @{ Metric = 'Failed'; Value = "❌ $pesterFailed" },
              @{ Metric = 'Skipped'; Value = "⏭️ $pesterSkipped" },
              @{ Metric = 'Not Run'; Value = "⏸️ $pesterNotRun" }
            )
          }
          else {
            $pesterRows = @(
              @{ Metric = 'Total'; Value = '0' },
              @{ Metric = 'Passed'; Value = "✅ $pesterPassed" },
              @{ Metric = 'Failed'; Value = "❌ $pesterFailed" },
              @{ Metric = 'Skipped'; Value = "⏭️ $pesterSkipped" },
              @{ Metric = 'Not Run'; Value = "⏸️ $pesterNotRun" },
              @{ Metric = 'Info'; Value = if ($pesterNotRun -gt 0) { 'No test cases executed; some discovered cases were not run.' } else { 'No test case results were provided.' } }
            )
          }

          function Get-SharedColumnWidths {
            param(
              [Parameter(Mandatory = $true)]
              [object[]]$TableSpecs,
              [double]$Scale = 1.5
            )

            $maxFirstColumn = 0
            $maxSecondColumn = 0

            foreach ($table in $TableSpecs) {
              $headers = [string[]]$table.Headers
              $rows = [object[]]$table.Rows

              if ($headers.Count -lt 2) {
                continue
              }

              $maxFirstColumn = [math]::Max($maxFirstColumn, $headers[0].Replace("`r", '').Replace("`n", ' ').Length)
              $maxSecondColumn = [math]::Max($maxSecondColumn, $headers[1].Replace("`r", '').Replace("`n", ' ').Length)

              foreach ($row in $rows) {
                $firstValue = [string]$row[$headers[0]]
                $secondValue = [string]$row[$headers[1]]
                $maxFirstColumn = [math]::Max($maxFirstColumn, $firstValue.Replace("`r", '').Replace("`n", ' ').Length)
                $maxSecondColumn = [math]::Max($maxSecondColumn, $secondValue.Replace("`r", '').Replace("`n", ' ').Length)
              }
            }

            @(
              [int][math]::Ceiling([math]::Max($maxFirstColumn, 3) * $Scale),
              [int][math]::Ceiling([math]::Max($maxSecondColumn, 3) * $Scale)
            )
          }

          $sharedColumnWidths = Get-SharedColumnWidths -TableSpecs @(
            @{ Headers = @('Item', 'Value'); Rows = $ciInfoRows },
            @{ Headers = @('Step', 'Result'); Rows = $stepRows },
            @{ Headers = @('Metric', 'Value'); Rows = $pesterRows }
          ) -Scale 1.5

          $sections = @(
            @{
              activityTitle = 'CI Info'
              text          = (New-MarkdownTable -Headers @('Item', 'Value') -Rows $ciInfoRows -ColumnWidths $sharedColumnWidths)
            },
            @{
              activityTitle = 'Stage: Pipeline Steps'
              text          = (New-MarkdownTable -Headers @('Step', 'Result') -Rows $stepRows -ColumnWidths $sharedColumnWidths)
            },
            @{
              activityTitle = 'Pester Test Results'
              text          = (New-MarkdownTable -Headers @('Metric', 'Value') -Rows $pesterRows -ColumnWidths $sharedColumnWidths)
            }
          )

          if ($diagnostics.Count -gt 0) {
            $sections += @{
              activityTitle = 'Notification Diagnostics'
              facts         = @(
                @{ name = 'Warnings'; value = ($diagnostics -join '; ') }
              )
            }
          }

          $actions = @()
          if ($runUrl) {
            $actions += @{
              '@type'  = 'OpenUri'
              name     = '🔗 View Workflow Run'
              targets  = @(
                @{ os = 'default'; uri = $runUrl }
              )
            }
          }

          $payload = @{
            '@type'           = 'MessageCard'
            '@context'        = 'http://schema.org/extensions'
            themeColor        = $statusMeta.Color
            title             = "🚀 Pipeline: $workflowName"
            text              = "Pipeline Status: **$($statusMeta.Icon) $statusLabel**`n`nBranch: ``$branchName`` · Commit: ``$shortSha`` `n`nMessage: $commitTitle`n`nTriggered by: $actorName"
            sections          = $sections
            potentialAction   = $actions
          }

          $payloadJson = $payload | ConvertTo-Json -Depth 10 -Compress

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Invoke-RestMethod -Method Post -Uri $webhook -ContentType 'application/json' -Body $payloadJson | Out-Null
              Write-Host 'Teams notification sent successfully.'
              break
            }
            catch {
              if ($attempt -eq $maxAttempts) {
                Write-Error "Failed to send Teams notification after $maxAttempts attempts: $($_.Exception.Message)"
                exit 1
              }

              Write-Warning "Teams notification attempt $attempt failed: $($_.Exception.Message). Retrying..."
              Start-Sleep -Seconds ([math]::Pow(2, $attempt))
            }
          }

name: Notify Teams of Job Status
on:
  workflow_call:
    inputs:
      job_status:
        required: true
        type: string
      steps_json:
        description: 'JSON object mapping step name to outcome, e.g. {"Build":"success","Test":"failure"}'
        required: false
        type: string
        default: '{}'
      pester_total:
        required: false
        type: number
        default: 0
      pester_passed:
        required: false
        type: number
        default: 0
      pester_failed:
        required: false
        type: number
        default: 0
      pester_skipped:
        required: false
        type: number
        default: 0
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: send msg
        env:
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
          STATUS: ${{ inputs.job_status }}
          STEPS_JSON: ${{ inputs.steps_json }}
          PESTER_TOTAL: ${{ inputs.pester_total }}
          PESTER_PASSED: ${{ inputs.pester_passed }}
          PESTER_FAILED: ${{ inputs.pester_failed }}
          PESTER_SKIPPED: ${{ inputs.pester_skipped }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$STATUS" = "success" ]; then COLOR=00FF00; else COLOR=FF0000; fi

          # Default STEPS_JSON to empty object when not provided
          STEPS_JSON="${STEPS_JSON:-{}}"

          # Build per-step facts from the JSON object
          STEP_FACTS=$(echo "$STEPS_JSON" | jq -c '[to_entries[] | {
            "name": .key,
            "value": (if   .value == "success"   then "✅ success"
                      elif .value == "failure"   then "❌ failure"
                      elif .value == "skipped"   then "⏭️ skipped"
                      elif .value == "cancelled" then "🚫 cancelled"
                      else "🔄 " + .value end)
          }]')

          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_TITLE=$(echo "$COMMIT_MSG" | head -1)

          # Build CI info facts (branch / commit / author)
          CI_FACTS=$(jq -n \
            --arg workflow "$WORKFLOW" \
            --arg branch   "$BRANCH" \
            --arg sha      "$SHORT_SHA" \
            --arg msg      "$COMMIT_TITLE" \
            --arg actor    "$ACTOR" \
            '[
              {"name":"Workflow",     "value":$workflow},
              {"name":"Branch",       "value":$branch},
              {"name":"Commit",       "value":$sha},
              {"name":"Message",      "value":$msg},
              {"name":"Triggered by", "value":$actor}
            ]')

          # Build sections array: pipeline overview + CI info
          SECTIONS=$(jq -n \
            --arg       status     "$STATUS" \
            --argjson   step_facts "$STEP_FACTS" \
            --argjson   ci_facts   "$CI_FACTS" \
            '[
              {"activityTitle": ("Pipeline overall: " + $status), "facts": $step_facts},
              {"activityTitle": "CI Info", "facts": $ci_facts}
            ]')

          # Append Pester section only when tests were actually run
          if [ "$PESTER_TOTAL" -gt 0 ]; then
            PESTER_SECTION=$(jq -n \
              --argjson total   "$PESTER_TOTAL" \
              --argjson passed  "$PESTER_PASSED" \
              --argjson failed  "$PESTER_FAILED" \
              --argjson skipped "$PESTER_SKIPPED" \
              '{"activityTitle":"Pester Test Results","facts":[
                {"name":"Total",        "value":($total   | tostring)},
                {"name":"✅ Passed",    "value":($passed  | tostring)},
                {"name":"❌ Failed",    "value":($failed  | tostring)},
                {"name":"⏭️ Skipped",  "value":($skipped | tostring)}
              ]}')
            SECTIONS=$(echo "$SECTIONS" | jq --argjson ps "$PESTER_SECTION" '. + [$ps]')
          fi

          # "View Workflow Run" button
          ACTIONS=$(jq -n --arg url "$RUN_URL" '[{
            "@type": "OpenUri",
            "name":  "🔗 View Workflow Run",
            "targets": [{"os": "default", "uri": $url}]
          }]')

          PAYLOAD=$(jq -n \
            --arg     color    "$COLOR" \
            --arg     status   "$STATUS" \
            --argjson sections "$SECTIONS" \
            --argjson actions  "$ACTIONS" \
            '{
              "@type":           "MessageCard",
              "@context":        "http://schema.org/extensions",
              "themeColor":      $color,
              "summary":         ("Pipeline " + $status),
              "sections":        $sections,
              "potentialAction": $actions
            }')

          curl -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               "$WEBHOOK"

name: Notify Teams of Job Status
on:
  workflow_call:
    inputs:
      job_status:
        required: true
        type: string
      steps_json:
        description: 'JSON object mapping step name to outcome, e.g. {"Build":"success","Test":"failure"}'
        required: false
        type: string
        default: '{}'
      pester_total:
        required: false
        type: number
        default: 0
      pester_passed:
        required: false
        type: number
        default: 0
      pester_failed:
        required: false
        type: number
        default: 0
      pester_skipped:
        required: false
        type: number
        default: 0
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: send msg
        env:
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
          STATUS: ${{ inputs.job_status }}
          STEPS_JSON: ${{ inputs.steps_json }}
          PESTER_TOTAL: ${{ inputs.pester_total }}
          PESTER_PASSED: ${{ inputs.pester_passed }}
          PESTER_FAILED: ${{ inputs.pester_failed }}
          PESTER_SKIPPED: ${{ inputs.pester_skipped }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$STATUS" in
            success)   COLOR=00CC44; STATUS_ICON="✅" ;;
            failure)   COLOR=FF0000; STATUS_ICON="❌" ;;
            cancelled) COLOR=808080; STATUS_ICON="🚫" ;;
            *)         COLOR=FFA500; STATUS_ICON="⏭️" ;;
          esac

          STEPS_JSON="${STEPS_JSON:-{}}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_TITLE=$(echo "$COMMIT_MSG" | head -1)

          # Map each step outcome to an emoji label (single-line filter, object-lookup avoids if/elif)
          STEP_FACTS=$(echo "$STEPS_JSON" | jq -c '[to_entries[] | {"name": .key, "value": ({"success":"✅ success","failure":"❌ failure","skipped":"⏭️ skipped","cancelled":"🚫 cancelled"}[.value] // .value)}]')

          # Build sections: Pipeline Steps + CI Info in one jq call (single-line filter)
          SECTIONS=$(jq -cn \
            --argjson steps "$STEP_FACTS" \
            --arg wf    "$WORKFLOW" \
            --arg br    "$BRANCH" \
            --arg sha   "$SHORT_SHA" \
            --arg msg   "$COMMIT_TITLE" \
            --arg actor "$ACTOR" \
            '[{"activityTitle":"Stage: Pipeline Steps","facts":$steps},{"activityTitle":"CI Info","facts":[{"name":"Workflow","value":$wf},{"name":"Branch","value":$br},{"name":"Commit","value":$sha},{"name":"Message","value":$msg},{"name":"Triggered by","value":$actor}]}]')

          # Append Pester section only when tests were actually run
          if [ "$PESTER_TOTAL" -gt 0 ]; then
            PESTER_SEC=$(jq -cn \
              --arg total   "$PESTER_TOTAL" \
              --arg passed  "$PESTER_PASSED" \
              --arg failed  "$PESTER_FAILED" \
              --arg skipped "$PESTER_SKIPPED" \
              '{"activityTitle":"Pester Test Results","facts":[{"name":"Total","value":$total},{"name":"✅ Passed","value":$passed},{"name":"❌ Failed","value":$failed},{"name":"⏭️ Skipped","value":$skipped}]}')
            SECTIONS=$(echo "$SECTIONS" | jq -c --argjson ps "$PESTER_SEC" '. + [$ps]')
          fi

          # "View Workflow Run" button
          ACTIONS=$(jq -cn --arg url "$RUN_URL" '[{"@type":"OpenUri","name":"🔗 View Workflow Run","targets":[{"os":"default","uri":$url}]}]')

          # Assemble final payload (single-line filter)
          PAYLOAD=$(jq -cn \
            --arg     color  "$COLOR" \
            --arg     icon   "$STATUS_ICON" \
            --arg     status "$STATUS" \
            --arg     wf     "$WORKFLOW" \
            --arg     br     "$BRANCH" \
            --arg     sha    "$SHORT_SHA" \
            --arg     msg    "$COMMIT_TITLE" \
            --arg     actor  "$ACTOR" \
            --argjson sections "$SECTIONS" \
            --argjson actions  "$ACTIONS" \
            '{"@type":"MessageCard","@context":"http://schema.org/extensions","themeColor":$color,"title":("🚀 Pipeline: " + $wf),"text":("Pipeline Status: **" + $icon + " " + $status + "**\n\nBranch: `" + $br + "` · Commit: `" + $sha + "`\n\nMessage: " + $msg + "\n\nTriggered by: " + $actor),"sections":$sections,"potentialAction":$actions}')

          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK"

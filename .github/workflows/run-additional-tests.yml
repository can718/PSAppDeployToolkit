name: Run Additional Tests (Reusable)

on:
  workflow_call:

env:
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  discover-agent:
    name: Discover Agent Machine
    runs-on: [self-hosted, Windows, X64, API]
    outputs:
      runner-label: ${{ steps.launch-agent.outputs.runner-label }}
    env:
      INFRA_MI_CLIENT_ID: ${{ secrets.INFRA_MI_CLIENT_ID }}
      INFRA_KEYVAULT: ${{ vars.INFRA_KEYVAULT }}
      TERRAFORGE_CONFIG_NAME: "Lite (CM2509 Github)-Agent"
      TERRAFORGE_API_BASE_URL: ${{ vars.TERRAFORGE_API_BASE_URL }}
      TERRAFORGE_API_KEY_SECRET: ${{ vars.TERRAFORGE_API_KEY_SECRET }}
    steps:
      - name: Check out scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Launch Agent
        id: launch-agent
        shell: pwsh
        run: |
          # Load shared TerraForge helper functions (extracted for reuse across workflows)
          . "${{ github.workspace }}/.github/scripts/TerraForge-AgentHelper.ps1"

          Invoke-TFLaunchAgent -ConfigName "Lite (CM2509 Github)-Agent"

  run-additional-tests:
    name: Run Additional Tests
    needs: discover-agent
    runs-on: ${{ needs.discover-agent.outputs.runner-label }}
    outputs:
      steps_json:     ${{ steps.collect-outputs.outputs.steps_json }}
      pester_total:   ${{ steps.run-pester.outputs.pester-total }}
      pester_passed:  ${{ steps.run-pester.outputs.pester-passed }}
      pester_failed:  ${{ steps.run-pester.outputs.pester-failed }}
      pester_skipped: ${{ steps.run-pester.outputs.pester-skipped }}
    strategy:
      fail-fast: false
    env:
      INFRA_MI_CLIENT_ID: ${{ secrets.INFRA_MI_CLIENT_ID }}
      INFRA_KEYVAULT: ${{ vars.INFRA_KEYVAULT }}
      TERRAFORGE_API_BASE_URL: ${{ vars.TERRAFORGE_API_BASE_URL }}
      TERRAFORGE_API_KEY_SECRET: ${{ vars.TERRAFORGE_API_KEY_SECRET }}
      TERRAFORGE_CONFIG_NAME: "Lite (CM2509 Github)-Agent"
    steps:
    - name: Check out repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # https://github.com/actions/checkout/releases/tag/v6.0.2
      env:
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: core.autocrlf
        GIT_CONFIG_VALUE_0: 'false'

    - name: Set Test Run Start
      id: set-test-run-start
      shell: pwsh
      env:
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        # Load shared TerraForge helper functions
        . "${{ github.workspace }}/.github/scripts/TerraForge-AgentHelper.ps1"

        # Start the test run and write test-run-id to GitHub output
        Invoke-TFStartTestRun `
            -Title "PSADT CM Tests - Build $($env:GITHUB_RUN_ID)_$($env:GITHUB_ACTOR)"

    - name: Install Node.js (required for GitHub Actions on self-hosted runner)
      shell: pwsh
      run: |
        if (-not (Get-Command node -ErrorAction Ignore)) {
          Write-Host "Node.js not found, installing..."
          $installer = "$env:TEMP\node-lts.msi"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v20.19.0/node-v20.19.0-x64.msi" -OutFile $installer
          Start-Process msiexec.exe -Wait -ArgumentList "/I $installer /quiet /norestart"
          # Refresh PATH in current session
          $env:PATH = [System.Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('PATH', 'User')
          Write-Host "Node.js installed: $(node --version)"
        } else {
          Write-Host "Node.js already installed: $(node --version)"
        }

    - name: Install 7-Zip (required for build packaging on self-hosted runner)
      shell: pwsh
      run: |
        # Check if 7-Zip is already installed via registry
        $registryPaths = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )
        $installedVersion = $null
        foreach ($path in $registryPaths) {
          $app = Get-ItemProperty $path -ErrorAction SilentlyContinue |
                 Where-Object { $_.DisplayName -like '*7-Zip*' }
          if ($app) { $installedVersion = $app.DisplayVersion; break }
        }
        if ($installedVersion) {
          Write-Host "7-Zip $installedVersion is already installed."
        } else {
          # Detect architecture and build download URL
          $arch = if ([Environment]::Is64BitOperatingSystem) { 'x64' } else { 'x32' }
          $fileName = "7z2409-$arch.msi"
          $downloadUrl = "https://www.7-zip.org/a/$fileName"
          $tempFile = Join-Path $env:TEMP $fileName
          Write-Host "Downloading 7-Zip from $downloadUrl ..."
          (New-Object System.Net.WebClient).DownloadFile($downloadUrl, $tempFile)
          Write-Host "Installing 7-Zip silently..."
          $process = Start-Process msiexec.exe -ArgumentList "/i `"$tempFile`" /qn /norestart" -Wait -PassThru
          Remove-Item $tempFile -Force -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            throw "7-Zip installation failed with exit code: $($process.ExitCode)"
          }
          # Refresh PATH in current session
          $env:PATH = [System.Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + [System.Environment]::GetEnvironmentVariable('PATH', 'User')
          # Verify
          $ver = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                  Where-Object { $_.DisplayName -like '*7-Zip*' }).DisplayVersion
          Write-Host "7-Zip $ver installed successfully."
        }

    - name: Display the path
      shell: pwsh
      run: echo ${env:PATH}

    - name: Version Display
      shell: pwsh
      run: $PSVersionTable

    - name: Install .NET 10 SDK (required for net10.0 build target)
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # https://github.com/actions/setup-dotnet/releases/tag/v4.3.1
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # https://github.com/actions/cache/releases/tag/v5.0.5
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Cache PowerShell modules
      id: psmodule-cache
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # https://github.com/actions/cache/releases/tag/v5.0.3
      with:
        path: ~\Documents\WindowsPowerShell\Modules
        key: ${{ runner.os }}-psmodule-PSScriptAnalyzer-1.25.0-Pester-5.7.1-platyPS-0.14.2-Alt3.Docusaurus.Powershell-1.0.37

    - name: Install PowerShell modules
      if: steps.psmodule-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        # Upgrade PowerShellGet and PackageManagement first (required on older self-hosted runners)
        Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
        Install-Module -Name PowerShellGet -MinimumVersion 2.2.5 -Force -Scope CurrentUser -AllowClobber
        # Reload the updated PowerShellGet into current session
        Import-Module PowerShellGet -MinimumVersion 2.2.5 -Force
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
        Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
        Install-Module -Name platyPS -RequiredVersion 0.14.2 -Force -Scope CurrentUser
        Install-Module -Name Alt3.Docusaurus.Powershell -RequiredVersion 1.0.37 -Force -Scope CurrentUser

    - name: Configure NuGet source
      shell: pwsh
      run: |
        dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org 2>&1 | Out-Null
        Write-Host "NuGet sources:"
        dotnet nuget list source

    - name: Build (minimal - Prerequisites, Clean, Dependencies, DotNet, Build)
      id: build
      shell: pwsh
      run: |
        & (Import-Module -Name .\src\PSAppDeployToolkit.Build -PassThru) {
            Invoke-ADTModuleBuild -Steps 'Prerequisites', 'Clean', 'Dependencies', 'DotNet', 'Build'
        }

    - name: Generate artifact templates
      id: exports
      shell: pwsh
      run: |
        & (Import-Module -Name .\src\PSAppDeployToolkit.Build -PassThru) { Invoke-ADTCustomModuleBuild -Actions 'Export-ADTScriptTemplate', 'Compress-ADTBuildAssetContent' }

    - name: Prepare PSADT templates for deployment test
      id: template-prep
      shell: pwsh
      run: |
        $v3Src = '.\src\Artifacts\Template_v3'
        $v4Src = '.\src\Artifacts\Template_v4'

        Write-Host "V3 source: $(Resolve-Path $v3Src -ErrorAction SilentlyContinue)"
        Write-Host "V4 source: $(Resolve-Path $v4Src -ErrorAction SilentlyContinue)"

        if (-not (Test-Path $v3Src)) {
          Write-Warning "Template_v3 directory not found: '$v3Src' - skipping template prep"
          exit 0
        }
        if (-not (Test-Path $v4Src)) {
          Write-Warning "Template_v4 directory not found: '$v4Src' - skipping template prep"
          exit 0
        }

        $v3Dest = (New-Item -ItemType Directory -Force -Path '.\src\Artifacts\TestTemplates\v3').FullName
        $v4Dest = (New-Item -ItemType Directory -Force -Path '.\src\Artifacts\TestTemplates\v4').FullName

        Copy-Item -Path "$v3Src\*" -Destination $v3Dest -Recurse -Force
        Copy-Item -Path "$v4Src\*" -Destination $v4Dest -Recurse -Force

        Write-Host "V3 template ready at: $v3Dest"
        Write-Host "V4 template ready at: $v4Dest"
        Write-Host "V3 contents: $((Get-ChildItem $v3Dest | Select-Object -ExpandProperty Name) -join ', ')"
        Write-Host "V4 contents: $((Get-ChildItem $v4Dest | Select-Object -ExpandProperty Name) -join ', ')"

        "PSADT_TEMPLATE_V3_DIR=$v3Dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "PSADT_TEMPLATE_V4_DIR=$v4Dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    # Add your new test cases below this line
    - name: Run Additional Tests
      id: run-pester
      shell: pwsh
      env:
        PSADT_TEMPLATE_V3_DIR: ${{ steps.template-prep.outputs.PSADT_TEMPLATE_V3_DIR }}
        PSADT_TEMPLATE_V4_DIR: ${{ steps.template-prep.outputs.PSADT_TEMPLATE_V4_DIR }}
        TEST_RUN_ID: ${{ steps.set-test-run-start.outputs.test-run-id }}
      run: |
        New-Item -ItemType Directory -Force -Path '.\src\Artifacts\TestOutput' | Out-Null
        # 1) Run Validation first as a hard gate.
        $validationConfig = New-PesterConfiguration
        $validationConfig.Run.Path = '.\src\Tests\Additional'
        $validationConfig.Filter.Tag = @('Validation')
        $validationConfig.Output.Verbosity = 'Detailed'
        $validationConfig.TestResult.Enabled = $true
        $validationConfig.TestResult.OutputPath = '.\src\Artifacts\TestOutput\AdditionalTests.xml'
        $validationConfig.TestResult.OutputFormat = 'NUnitXml'
        $validationConfig.Run.PassThru = $true
        $validationResult = Invoke-Pester -Configuration $validationConfig

        if ($validationResult.FailedCount -gt 0)
        {
          "pester-total=$($validationResult.TotalCount)"     | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pester-passed=$($validationResult.PassedCount)"   | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pester-failed=$($validationResult.FailedCount)"   | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pester-skipped=$($validationResult.SkippedCount)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          throw 'Validation tests failed. WinSCP/VLC test suites were not started.'
        }

        # 2) Run WinSCP and VLC in parallel after validation succeeds.
        $tagsToRun = @('WinSCP', 'VLC')
        $parallelResults = $tagsToRun | ForEach-Object -Parallel {
          param($tag)

          Set-Location $using:GITHUB_WORKSPACE
          $testOutputDir = Join-Path $using:GITHUB_WORKSPACE 'src\Artifacts\TestOutput'
          $outputPath = Join-Path $testOutputDir ("AdditionalTests-{0}.xml" -f $tag)

          $env:PSADT_TEMPLATE_VALIDATION_PASSED = 'true'

          $config = New-PesterConfiguration
          $config.Run.Path = '.\src\Tests\Additional'
          $config.Filter.Tag = @($tag)
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = $outputPath
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.Run.PassThru = $true

          $result = Invoke-Pester -Configuration $config

          [pscustomobject]@{
            Tag = $tag
            TotalCount = $result.TotalCount
            PassedCount = $result.PassedCount
            FailedCount = $result.FailedCount
            SkippedCount = $result.SkippedCount
          }
        } -ThrottleLimit 2

        $allResults = @($validationResult) + @($parallelResults)
        $total = ($allResults | Measure-Object -Property TotalCount -Sum).Sum
        $passed = ($allResults | Measure-Object -Property PassedCount -Sum).Sum
        $failed = ($allResults | Measure-Object -Property FailedCount -Sum).Sum
        $skipped = ($allResults | Measure-Object -Property SkippedCount -Sum).Sum

        "pester-total=$total"     | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        "pester-passed=$passed"   | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        "pester-failed=$failed"   | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        "pester-skipped=$skipped" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

        if ($failed -gt 0)
        {
          throw "One or more Additional test suites failed. Failed count: $failed"
        }

    - name: Upload additional test results
      id: upload-artifacts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      with:
        name: additional-test-results
        path: .\src\Artifacts\TestOutput\AdditionalTests*.xml
        if-no-files-found: error
        overwrite: true
  # set test run end time job can be added here, using the test-run-id output from discover-agent job to correlate with the test run created in the beginning of the workflow
    - name: Complete Test Run
      id: complete-test-run
      if: always()
      shell: pwsh
      env:
        TEST_RUN_ID: ${{ steps.set-test-run-start.outputs.test-run-id }}
      run: |
        . "${{ github.workspace }}/.github/scripts/TerraForge-AgentHelper.ps1"
        Invoke-TFCompleteTestRun

    - name: Upload Test Results to Azure Blob Storage
      id: upload-to-blob
      if: always()
      shell: pwsh
      env:
        TEST_RUN_ID: ${{ steps.set-test-run-start.outputs.test-run-id }}
      run: |
        . "${{ github.workspace }}/.github/scripts/TerraForge-AgentHelper.ps1"
        Invoke-TFUploadTestResults -TestResultXmlPath '.\src\Artifacts\TestOutput\AdditionalTests.xml'

    - name: Collect step outcomes
      id: collect-outputs
      if: always()
      shell: pwsh
      run: |
        $steps = [ordered]@{
          'Build'                       = '${{ steps.build.outcome }}'
          'Generate Artifact Templates' = '${{ steps.exports.outcome }}'
          'Prepare Templates'           = '${{ steps.template-prep.outcome }}'
          'Run Pester Tests'            = '${{ steps.run-pester.outcome }}'
          'Upload Test Results'         = '${{ steps.upload-artifacts.outcome }}'
          'Complete Test Run'           = '${{ steps.complete-test-run.outcome }}'
          'Upload to Blob Storage'      = '${{ steps.upload-to-blob.outcome }}'
        }
        # Use AppendAllText with LF (not CRLF) so the value is not corrupted when consumed on Linux runners
        [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "steps_json=$($steps | ConvertTo-Json -Compress)`n", [System.Text.Encoding]::UTF8)

    - name: Reset Azure Session VM
      id: reset-sessionvm
      if: false #always()
      shell: pwsh
      run: |
        . "${{ github.workspace }}/.github/scripts/TerraForge-AgentHelper.ps1"
        Invoke-TFResetSessionVM

  notify-teams:
    name: Notify Teams
    needs: run-additional-tests
    if: always()
    uses: ./.github/workflows/notify_teams.yml
    with:
      job_status:     ${{ needs.run-additional-tests.result }}
      steps_json:     ${{ needs.run-additional-tests.outputs.steps_json }}
      pester_total:   ${{ fromJson(needs.run-additional-tests.outputs.pester_total   || '0') }}
      pester_passed:  ${{ fromJson(needs.run-additional-tests.outputs.pester_passed  || '0') }}
      pester_failed:  ${{ fromJson(needs.run-additional-tests.outputs.pester_failed  || '0') }}
      pester_skipped: ${{ fromJson(needs.run-additional-tests.outputs.pester_skipped || '0') }}
    secrets: inherit

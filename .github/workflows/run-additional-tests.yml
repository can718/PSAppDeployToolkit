name: Run Additional Tests (Reusable)

on:
  workflow_call:

env:
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  discover-agent:
    name: Discover Agent Machine
    runs-on: [self-hosted, Windows, X64, API]
    outputs:
      runner-label: ${{ steps.launch-agent.outputs.runner-label }}
    env:
      INFRA_MI_CLIENT_ID: '2d7fbe0d-b3d6-4905-9584-9dc45065865c'
      INFRA_KEYVAULT: 'kv-tfp-infra-management'
      TERRAFORGE_CONFIG_NAME: 'Lite (CM2509 Github)-Agent'
      TERRAFORGE_API_BASE_URL: 'https://terraforgeapi.southeastasia.cloudapp.azure.com'
      TERRAFORGE_API_KEY_SECRET: 'TerraforgeApiAccessKey'
    steps:
      - name: Launch Agent
        id: launch-agent
        shell: pwsh
        run: |
          # Login with Managed Identity (same as original Azure DevOps pipeline)
          Connect-AzAccount -Identity -AccountId $env:INFRA_MI_CLIENT_ID | Out-Null

          # Get TerraForge API access key from Key Vault
          $terraforgeApiAccessValue = Get-AzKeyVaultSecret `
            -SecretName $env:TERRAFORGE_API_KEY_SECRET `
            -VaultName $env:INFRA_KEYVAULT `
            -AsPlainText

          # Get TerraForge access token
          $headers = @{
              "Content-Type"  = "application/json"
              "X-Client-Type" = "Automated"
          }
          $payload = @{ accessKey = $terraforgeApiAccessValue } | ConvertTo-Json

          Write-Host "Requesting TerraForge access token..."
          $response = Invoke-WebRequest -Uri "$env:TERRAFORGE_API_BASE_URL/api/auth/token" `
              -Method Post -Headers $headers -Body $payload -ErrorAction Stop
          $content = $response.Content | ConvertFrom-Json -ErrorAction Stop

          if (-not ($content -and $content.data -and $content.data.accessToken)) {
              throw "Failed to get access token from response: $($response.Content)"
          }

          # Launch/discover agent machine
          $authHeaders = @{
              "Authorization" = "Bearer $($content.data.accessToken)"
              "Content-Type"  = "application/json"
              "X-Client-Type" = "Automated"
          }
          $launchPayload = @{
              configName = $env:TERRAFORGE_CONFIG_NAME
              poolType   = 3
          } | ConvertTo-Json

          Write-Host "Sending discover agent request for config: $env:TERRAFORGE_CONFIG_NAME ..."
          $launchResponse = Invoke-WebRequest -Uri "$env:TERRAFORGE_API_BASE_URL/api/v1/TestRun/Launch" `
              -Method Post -Headers $authHeaders -Body $launchPayload -ErrorAction Stop
          $launchContent = $launchResponse.Content | ConvertFrom-Json -ErrorAction Stop

          $machineId = $launchContent.data.machineIds[0]
          $agentName = "MyRunner-$machineId"
          $machineUrl = "https://terraforge.southeastasia.cloudapp.azure.com/machines/$machineId"

          Write-Host "Launched agent machine: $agentName"
          Write-Host "Machine URL: $machineUrl"
          # Output runner label for next job
          "runner-label=$agentName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  run-additional-tests:
    name: Run Additional Tests
    needs: discover-agent
    runs-on: ${{ needs.discover-agent.outputs.runner-label }}
    strategy:
      fail-fast: false
    steps:
    - name: Check out repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # https://github.com/actions/checkout/releases/tag/v6.0.2

    - name: Display the path
      shell: powershell
      run: echo ${env:PATH}

    - name: Version Display
      shell: powershell
      run: $PSVersionTable

    - name: Cache NuGet packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # https://github.com/actions/cache/releases/tag/v5.0.5
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Cache PowerShell modules
      id: psmodule-cache
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # https://github.com/actions/cache/releases/tag/v5.0.3
      with:
        path: ~\Documents\WindowsPowerShell\Modules
        key: ${{ runner.os }}-psmodule-PSScriptAnalyzer-1.25.0-Pester-5.7.1-platyPS-0.14.2-Alt3.Docusaurus.Powershell-1.0.37

    - name: Install PowerShell modules
      if: steps.psmodule-cache.outputs.cache-hit != 'true'
      shell: powershell
      run: |
        # Upgrade PowerShellGet and PackageManagement first (required on older self-hosted runners)
        Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser
        Install-Module -Name PowerShellGet -MinimumVersion 2.2.5 -Force -Scope CurrentUser -AllowClobber
        # Reload the updated PowerShellGet into current session
        Import-Module PowerShellGet -MinimumVersion 2.2.5 -Force
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
        Install-Module -Name Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
        Install-Module -Name platyPS -RequiredVersion 0.14.2 -Force -Scope CurrentUser
        Install-Module -Name Alt3.Docusaurus.Powershell -RequiredVersion 1.0.37 -Force -Scope CurrentUser

    # Add your new test cases below this line
    - name: Run Additional Tests
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path '.\src\Artifacts\TestOutput' | Out-Null
        $config = New-PesterConfiguration
        $config.Run.Path = '.\src\Tests\Additional'
        $config.Output.Verbosity = 'Detailed'
        $config.TestResult.Enabled = $true
        $config.TestResult.OutputPath = '.\src\Artifacts\TestOutput\AdditionalTests.xml'
        $config.TestResult.OutputFormat = 'NUnitXml'
        Invoke-Pester -Configuration $config

    - name: Upload additional test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      with:
        name: additional-test-results
        path: .\src\Artifacts\TestOutput\AdditionalTests.xml
        if-no-files-found: error
        overwrite: true
